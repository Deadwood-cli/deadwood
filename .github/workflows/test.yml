name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The race detector needs a C toolchain, which is not reliably
          # present on the Windows runner.
          - os: ubuntu-latest
            test-flags: -race
          - os: macos-latest
            test-flags: -race
          - os: windows-latest
            test-flags: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately not go-version-file. Go's linker only emits the LC_UUID
      # load command by default from 1.24 (golang/go#68678), and the dyld on
      # current macOS refuses to launch a binary without one, so a test binary
      # built by the 1.22 declared in go.mod aborts before running. The
      # minimum-go job below still holds us to that declared floor.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true

      # internal/git integration tests shell out to real git, which refuses to
      # commit without an identity.
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.name "deadwood-ci"
          git config --global user.email "ci@deadwood.invalid"
          git config --global init.defaultBranch main

      - run: go build ./...

      - run: go vet ./...

      - run: go test ${{ matrix.test-flags }} ./...

  # Proves the go directive in go.mod is a real floor rather than a claim.
  # Linux only: the LC_UUID problem above makes older toolchains unrunnable on
  # the macOS runner, and it is a property of Apple's loader, not our code.
  minimum-go:
    name: minimum go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git identity for fixture repos
        run: |
          git config --global user.name "deadwood-ci"
          git config --global user.email "ci@deadwood.invalid"
          git config --global init.defaultBranch main

      - run: go build ./...

      - run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true

      # v9 uses Node 24; v8 still requires Node 20, which GitHub Actions now rejects.
      # Pin the peeled commit SHA of the annotated v9.3.0 tag, not the tag object.
      # verify defaults to true and runs `golangci-lint config verify`, which
      # downloads a JSON schema from golangci-lint.run and times out in CI.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.1.6
          verify: false
